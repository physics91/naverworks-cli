name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - name: Reuse Guardrails
        run: scripts/check-reuse-guardrails.sh .

      - name: Fast Test
        if: github.event_name == 'pull_request'
        run: make test-fast

      - name: Full Test
        if: github.event_name == 'push'
        run: make test-full

      - name: Build
        run: go build -o naverworks .

      - name: Vet
        run: go vet ./...

  # Credential file protection is enforced through Windows ACLs, which cannot be
  # exercised on Linux. Without this job the icacls inspection, foreign-ACE
  # removal, and post-repair verification paths ship untested.
  #
  # Scoped to ./internal/... deliberately. The cmd package's smoke and journey
  # tests write their fixtures to a POSIX-style .config path while Windows reads
  # %AppData%, so ~45 of them fail regardless of this change — verified by
  # running the suite on f8ac567, before any of it. Widening this job is
  # tracked separately; keeping it scoped means a red build here is a real
  # regression in the ACL code.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: go build -o naverworks.exe .

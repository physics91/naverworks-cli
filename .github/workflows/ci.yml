name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"

      - name: Reuse Guardrails
        run: scripts/check-reuse-guardrails.sh .

      - name: Verify maintenance baseline
        run: make verify-maintenance

  # Credential file protection is enforced through Windows ACLs, which cannot be
  # exercised on Linux. Without this job the icacls inspection, foreign-ACE
  # removal, and post-repair verification paths ship untested.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"

      - name: Prepare GNU Make and Bash
        shell: pwsh
        run: |
          $make = "C:\msys64\usr\bin\make.exe"
          $pacman = "C:\msys64\usr\bin\pacman.exe"
          if (-not (Test-Path $make)) {
            & $pacman --noconfirm -Sy make
            if ($LASTEXITCODE -ne 0) { throw "GNU Make installation failed" }
          }
          if (-not (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            throw "MSYS2 Bash is unavailable"
          }
          & $make --version
          if ($LASTEXITCODE -ne 0) { throw "GNU Make verification failed" }

      - name: Verify maintenance baseline
        shell: pwsh
        env:
          SHELL: C:/msys64/usr/bin/bash.exe
          MAKESHELL: C:/msys64/usr/bin/bash.exe
        run: '& "C:\msys64\usr\bin\make.exe" verify-maintenance'

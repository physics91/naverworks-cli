name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"

      - name: Maintenance preflight
        run: make verify-maintenance

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build npm packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./npm/build-npm.sh "$VERSION" dist

      - name: Publish to npm (Trusted Publishing / OIDC)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          ROOT="$(pwd)"
          for dir in npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64 npm/win32-x64; do
            if [ -f "$dir/naverworks" ] || [ -f "$dir/naverworks.exe" ]; then
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done
          (cd "$ROOT/npm/cli" && npm publish --access public --provenance)
